[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mahjong-meme"
version = "0.1.0"
description = "Launch a Chromium browser, attach via CDP to Mahjong Soul, and stream live match state."
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40,<2",
]

[project.scripts]
mahjong-meme = "mahjong_meme.__main__:main"

[tool.setuptools.packages.find]
include = ["mahjong_meme*"]

[tool.setuptools.package-data]
mahjong_meme = ["scripts/*.js"]
